@version: 4.12
@include "scl.conf"

# Starter configuration. It is intentionally small but valid.
# Students add network sources, filters, rewrites, destinations, and log paths.

options {
    keep-hostname(yes);
    use-dns(no);
    time-reopen(1);       # short retry delay for a classroom failure/recovery exercise
    stats(level(2));
};

source s_internal {
    internal();
};

destination d_internal {
    file(
        "/var/log/lab/internal.log"
        create-dirs(yes)
        perm(0644)
    );
};

log {
    source(s_internal);
    destination(d_internal);
};

