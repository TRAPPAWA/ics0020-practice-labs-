name: syslog-ng-lab

services:
  syslog-ng:
    image: balabit/syslog-ng:4.12.0
    command: ["--no-caps"]
    volumes:
      - ./syslog-ng/conf/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./output/main:/var/log/lab
      - ./certs:/etc/syslog-ng/lab-certs:ro
      - syslogng_state:/var/lib/syslog-ng
    ports:
      - "5514:514/udp"    # BSD syslog over UDP: host 5514 -> container 514
      - "1514:1514/tcp"   # BSD syslog over TCP
      - "8514:8514/udp"   # IETF syslog over UDP (optional TLS task companion)
      - "6514:6514/tcp"   # IETF syslog over TLS (optional task)
    networks: [labnet]

  collector:
    image: balabit/syslog-ng:4.12.0
    volumes:
      - ./collector/conf/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./output/collector:/var/log/collector
    networks: [labnet]

  toolbox:
    build:
      context: ./tools
    entrypoint: ["python", "/opt/lab/labctl.py"]
    profiles: ["tools"]
    volumes:
      - ./certs:/certs:ro
    networks: [labnet]

  traffic-web:
    build:
      context: ./tools
    profiles: ["traffic"]
    entrypoint: ["python", "-u", "/opt/lab/traffic.py"]
    command: ["--role", "web", "--interval", "1.2"]
    depends_on: [syslog-ng]
    networks: [labnet]

  traffic-auth:
    build:
      context: ./tools
    profiles: ["traffic"]
    entrypoint: ["python", "-u", "/opt/lab/traffic.py"]
    command: ["--role", "auth", "--interval", "1.7"]
    depends_on: [syslog-ng]
    networks: [labnet]

  traffic-batch:
    build:
      context: ./tools
    profiles: ["traffic"]
    entrypoint: ["python", "-u", "/opt/lab/traffic.py"]
    command: ["--role", "batch", "--interval", "2.1"]
    depends_on: [syslog-ng]
    networks: [labnet]

networks:
  labnet:

volumes:
  syslogng_state:
