@version: 4.12
@include "scl.conf"

options {
    keep-hostname(yes);
    use-dns(no);
};

source s_alerts {
    network(transport(tcp) port(1601));
};

template t_alerts {
    template("${R_ISODATE} host=${HOST} facility=${FACILITY} level=${LEVEL} program=${PROGRAM} msg=${MESSAGE}\n");
};

destination d_alerts {
    file(
        "/var/log/collector/alerts.log"
        create-dirs(yes)
        perm(0644)
        template(t_alerts)
    );
};

log {
    source(s_alerts);
    destination(d_alerts);
};
