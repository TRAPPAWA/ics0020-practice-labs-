# Fluentd lab starter configuration.
# Students will evolve this file during the session.

<system>
  log_level info
  root_dir /fluentd/state
</system>

# Task 1: HTTP input. The URL path becomes the event tag.
<source>
  @type http
  @id in_http
  bind 0.0.0.0
  port 9880
</source>

# Optional observability endpoint used by the toolbox 'monitor' command.
<source>
  @type monitor_agent
  @id in_monitor
  bind 0.0.0.0
  port 24220
</source>

# Keep this broad route near the end. More-specific routes added later
# must appear before it, because Fluentd uses the first matching <match>.
<match lab.**>
  @type stdout
</match>

# Safety net for the lab so that unmatched events remain visible.
<match **>
  @type stdout
</match>
